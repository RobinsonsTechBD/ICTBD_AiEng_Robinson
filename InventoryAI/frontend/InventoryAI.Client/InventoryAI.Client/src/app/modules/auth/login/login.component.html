<!-- login.component.html -->
<div class="min-vh-100 d-flex align-items-center justify-content-center"
     style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-8 col-md-5 col-lg-4">

        <!-- Logo -->
        <div class="text-center text-white mb-4">
          <div class="d-inline-flex align-items-center justify-content-center rounded-3 bg-white bg-opacity-20 mb-3"
               style="width:64px;height:64px">
            <i class="bi bi-boxes fs-2 text-white"></i>
          </div>
          <h4 class="fw-bold mb-1">InventoryAI</h4>
          <p class="opacity-75" style="font-size:13px">Smart Inventory + AI Assistant</p>
        </div>

        <!-- Card -->
        <div class="card border-0 shadow-lg rounded-4">
          <div class="card-body p-4">
            <h5 class="fw-semibold mb-1 text-center">Sign In</h5>
            <p class="text-muted text-center small mb-4">Enter your credentials to continue</p>

            <!-- Error -->
            <div *ngIf="error" class="alert alert-danger alert-sm py-2 px-3 small mb-3 rounded-3">
              <i class="bi bi-exclamation-circle me-2"></i>{{ error }}
            </div>

            <form [formGroup]="form" (ngSubmit)="submit()">
              <!-- Username -->
              <div class="mb-3">
                <label class="form-label fw-semibold small">Username</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-person text-muted"></i>
                  </span>
                  <input class="form-control border-start-0 bg-light"
                         type="text" placeholder="Enter username"
                         formControlName="username"
                         [class.is-invalid]="form.get('username')?.invalid && form.get('username')?.touched">
                </div>
              </div>

              <!-- Password -->
              <div class="mb-4">
                <label class="form-label fw-semibold small">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-lock text-muted"></i>
                  </span>
                  <input class="form-control border-start-0 border-end-0 bg-light"
                         [type]="showPassword ? 'text' : 'password'"
                         placeholder="Enter password"
                         formControlName="password"
                         [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched">
                  <button type="button" class="btn btn-light border border-start-0"
                          (click)="showPassword=!showPassword">
                    <i [class]="'bi bi-eye' + (showPassword ? '-slash' : '') + ' text-muted'"></i>
                  </button>
                </div>
              </div>

              <!-- Submit -->
              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold"
                      [disabled]="form.invalid || isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                {{ isLoading ? 'Signing in...' : 'Sign In' }}
              </button>
            </form>
          </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-white opacity-75 mt-3 small">
          <i class="bi bi-robot me-1"></i>
          Powered by Ollama Local LLM + RAG
        </p>
      </div>
    </div>
  </div>
</div>
