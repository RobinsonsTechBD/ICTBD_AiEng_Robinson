<!-- layout.component.html -->
<div class="d-flex" style="min-height:100vh;background:#f8f9fa">

  <!-- Sidebar -->
  <nav class="sidebar bg-white border-end shadow-sm d-flex flex-column"
       style="width:260px;min-height:100vh;position:fixed;top:0;left:0;z-index:1000">

    <!-- Brand -->
    <div class="px-4 py-3 border-bottom d-flex align-items-center gap-2">
      <i class="bi bi-boxes text-primary fs-4"></i>
      <div>
        <div class="fw-bold text-dark" style="font-size:15px;line-height:1.2">InventoryAI</div>
        <div class="text-muted" style="font-size:11px">Smart Stock Management</div>
      </div>
    </div>

    <!-- Menu -->
    <div class="flex-grow-1 overflow-auto py-2">
      <ng-container *ngFor="let item of menuItems">
        <a [routerLink]="item.routeUrl" routerLinkActive="active bg-primary bg-opacity-10 text-primary"
           class="nav-link d-flex align-items-center gap-3 px-4 py-2 text-dark rounded-2 mx-2 mb-1"
           style="font-size:14px;transition:all .15s">
          <i [class]="'bi ' + item.icon + ' fs-6 text-secondary'"></i>
          {{ item.title }}
          <span *ngIf="item.title === 'Alerts' && alertCount > 0"
                class="badge bg-danger ms-auto rounded-pill">{{ alertCount }}</span>
        </a>
      </ng-container>
    </div>

    <!-- User info -->
    <div class="px-4 py-3 border-top">
      <div class="d-flex align-items-center gap-2">
        <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
             style="width:34px;height:34px;font-size:13px;font-weight:600">
          {{ initials }}
        </div>
        <div class="flex-grow-1 overflow-hidden">
          <div class="fw-semibold text-dark text-truncate" style="font-size:13px">{{ fullName }}</div>
          <div class="text-muted" style="font-size:11px">{{ role }}</div>
        </div>
        <button class="btn btn-sm btn-outline-secondary border-0" (click)="logout()" title="Logout">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <div class="flex-grow-1" style="margin-left:260px">

    <!-- Top bar -->
    <header class="bg-white border-bottom px-4 py-2 d-flex align-items-center justify-content-between sticky-top" style="z-index:999">
      <div>
        <h6 class="mb-0 fw-semibold text-dark">{{ pageTitle }}</h6>
        <small class="text-muted">{{ today | date:'EEEE, MMMM d, y' }}</small>
      </div>
      <div class="d-flex align-items-center gap-2">
        <a routerLink="/alerts" class="btn btn-sm btn-light position-relative">
          <i class="bi bi-bell"></i>
          <span *ngIf="alertCount > 0" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size:9px">
            {{ alertCount }}
          </span>
        </a>
        <a routerLink="/ai-chat" class="btn btn-sm btn-primary d-flex align-items-center gap-1">
          <i class="bi bi-robot"></i>
          <span class="d-none d-md-inline">AI Chat</span>
        </a>
      </div>
    </header>

    <!-- Router outlet -->
    <div class="p-4">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
